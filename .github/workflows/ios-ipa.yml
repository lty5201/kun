name: iOS IPA

# Builds the iOS app as an unsigned IPA for sideloading (AltStore, Sideloadly,
# eSign, etc. re-sign it with your own Apple ID during installation).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # project.yml is the source of truth (XcodeGen); the committed
      # project.pbxproj may lag behind it, e.g. after adding the
      # LyricsLiveActivity extension target. Regenerate it so the
      # archive includes every target in project.yml.
      - name: Generate Xcode project (XcodeGen)
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Archive the iOS app (unsigned)
        run: |
          mkdir -p .build/ios
          xcodebuild archive \
            -workspace ios/KumoneIOS.xcworkspace \
            -scheme KumoneIOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath .build/ios/Kun.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: Package the IPA
        run: |
          mkdir -p Payload dist
          APP_PATH="$(find .build/ios/Kun.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found in archive" >&2
            exit 1
          fi
          APP_NAME="$(basename "$APP_PATH")"
          cp -R "$APP_PATH" Payload/
          zip -qr dist/Kun-ios.ipa Payload

      - name: Upload the IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kun-ios-ipa
          path: dist/Kun-ios.ipa
          if-no-files-found: error
